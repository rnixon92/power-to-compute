name: CI

# Pull requests only. Pushes to main are tested and built by the deploy workflow.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prices are fetched at build time, so CI fetches them too.
      - run: npm run refresh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
