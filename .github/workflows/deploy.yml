name: Refresh and deploy

# Rebuilds the static site with fresh prices and filings, then publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    # Hourly through the US session and just after the close, weekdays (14:05–21:05 UTC).
    - cron: "5 14-21 * * 1-5"
    # Once a day, every day, so filings and bitcoin stay current over weekends.
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Nasdaq prices stay out of the repo. The last good snapshot lives in the Actions cache.
      - name: Restore last price snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/snapshots/market.json
          key: market-${{ github.run_id }}
          restore-keys: market-

      - name: Refresh prices and filings
        id: refresh
        run: npm run refresh
        continue-on-error: true

      - name: Keep this snapshot for the next run
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/snapshots/market.json
          key: market-${{ github.run_id }}

      - name: Check there is a snapshot to build from
        run: test -f data/snapshots/market.json

      - run: npm test
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # SEC filing dates are public. Committing them daily also keeps the schedule active,
      # since GitHub pauses scheduled workflows in repos with no commits for 60 days.
      - name: Save filings snapshot
        if: github.event.schedule == '30 11 * * *'
        run: |
          git config user.name "psp-refresh"
          git config user.email "psp-refresh@users.noreply.github.com"
          git add data/snapshots/filings.json
          git diff --staged --quiet || git commit -m "Refresh SEC filings snapshot"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
